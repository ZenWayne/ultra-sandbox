name: end-to-end install + proxy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: install + claude-yolo-automate - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    # Forks can't read secrets; only run on same-repo events
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker via colima (macOS arm64)
        if: matrix.os == 'macos-14'
        # Apple Silicon GitHub runners already run inside Apple's Virtualization
        # framework, so nested HVF fails with HV_UNSUPPORTED. colima --vm-type vz
        # uses Virtualization.framework directly and works in that nested context.
        run: |
          set -euxo pipefail
          brew install docker colima
          colima start --vm-type vz --cpu 2 --memory 4
          docker info

      - name: Detect API key availability
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY not set — Claude end-to-end test cannot run"
          fi

      # ============== STEP 1: run install.sh =================================
      - name: Run install.sh
        run: |
          set -euxo pipefail
          BRANCH="${{ github.event.pull_request.head.sha || github.sha }}" \
          REPO="${{ github.event.pull_request.head.repo.full_name || github.repository }}" \
            bash install.sh

      - name: Stage host paths the launcher bind-mounts
        run: |
          # Launcher mounts ~/.ssh (ro), ~/.claude (rw), ~/.claude.json (rw).
          # Docker auto-creates missing host paths as DIRECTORIES, which would
          # break the file mount on .claude.json. Pre-create explicitly.
          # Write {} not touch — claude rejects empty file as malformed JSON.
          mkdir -p "$HOME/.ssh" "$HOME/.claude"
          echo '{}' > "$HOME/.claude.json"

      # ============== STEP 2: run claude-yolo-automate =======================
      - name: Run claude-yolo-automate, ask Claude to invoke proxied python3
        if: steps.key.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          SANDBOX_MAP_PROCESSES: python3
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          # Run from a clean working directory so SANDBOX_DIR=$WORK_DIR/.ultra_sandbox
          # lives somewhere predictable and the launcher's same-path WORK_DIR mount
          # makes the absolute symlinks created by `sandbox map` resolve inside.
          WORK="$RUNNER_TEMP/proj"
          mkdir -p "$WORK"
          cd "$WORK"

          # Launcher hardcodes `docker run -it`; CI has no PTY → wrap with `script`.
          # Linux util-linux: script -qec "<cmd>" <file>
          # BSD (macOS):      script -q <file> <argv...>
          # `claude -p "..." --output-format text` is headless mode; the launcher
          # passes "$@" through to claude.
          PROMPT='Use the Bash tool to run python3 --version. Reply with ONLY that exact command output line, no preamble, no markdown, no extra words.'
          INNER="claude-yolo-automate -p \"$PROMPT\" --output-format text"

          if [ "$RUNNER_OS" = "macOS" ]; then
            script -q /dev/null bash -c "$INNER" | tee /tmp/claude_raw.txt
          else
            script -qec "$INNER" /dev/null | tee /tmp/claude_raw.txt
          fi

          # Strip ANSI / CR that script + TUIs sometimes inject
          sed -E $'s/\x1B\\[[0-9;]*[A-Za-z]//g; s/\r//g' /tmp/claude_raw.txt > /tmp/claude_out.txt

          HOST_VER="$(python3 --version 2>&1)"
          echo "expecting host python: $HOST_VER"
          if grep -F "$HOST_VER" /tmp/claude_out.txt >/dev/null; then
            echo "PASS: claude-yolo-automate -> Claude -> Bash python3 -> proxied to host"
          else
            echo "FAIL: host python version not in Claude reply"
            echo "----- claude output (cleaned) -----"
            cat /tmp/claude_out.txt
            echo "----- claude output (raw) -----"
            cat /tmp/claude_raw.txt
            exit 1
          fi
