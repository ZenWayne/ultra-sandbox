name: end-to-end install + proxy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: install + claude-yolo-automate - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # Forks can't read secrets; only run on same-repo events
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # macOS Intel: release publishes sandbox-darwin-arm64 but not -x86_64,
      # so build the Intel binary inline and pair with SKIP_SANDBOX=1 below.
      # Apple Silicon hosted runners (macos-14/15) don't expose nested
      # virtualization, so Docker must run on macos-15-intel (HVF available).
      - name: Build sandbox from source (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache cargo deps (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ultra-sandbox/sandbox-rs -> target

      - name: cargo build sandbox + install (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        working-directory: ultra-sandbox/sandbox-rs
        run: |
          set -euxo pipefail
          cargo build --release --target x86_64-apple-darwin
          mkdir -p "$HOME/.local/bin"
          install -m 755 target/x86_64-apple-darwin/release/sandbox "$HOME/.local/bin/sandbox"

      # ~600 MB ubuntu cloud image lima downloads on first VM boot. Cached by
      # content-hash dir name, so the key only needs to be stable across runs;
      # bump the suffix to invalidate (e.g., when lima upgrades to a new
      # ubuntu release).
      - name: Cache lima downloads (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/lima
          key: lima-cache-${{ runner.os }}-ubuntu24.04-v1

      - name: Install Docker (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        # Intel macOS supports HVF; lima/qemu boots correctly here.
        uses: crazy-max/ghaction-setup-docker@v4
        with:
          version: latest

      - name: Detect API key availability
        id: key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY not set — Claude end-to-end test cannot run"
          fi

      # Cache the claude_code_base image as a tarball across runs. The image
      # build is the slowest part of the macOS path (apt-get install + claude
      # installer ≈ 5–8 min). Key by Dockerfile hash so any change rebuilds.
      - name: Restore claude_code_base image (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/claude_code_base.tar.gz
          key: claude-image-${{ runner.os }}-${{ hashFiles('ultra-sandbox/claude_code_base.Dockerfile') }}

      - name: Load cached image if hit (macOS Intel)
        if: matrix.os == 'macos-15-intel' && steps.image-cache.outputs.cache-hit == 'true'
        run: |
          set -euxo pipefail
          gunzip -c /tmp/claude_code_base.tar.gz | docker load
          docker images claude_code_base

      # ============== STEP 1: run install.sh =================================
      - name: Run install.sh
        env:
          SKIP_IMAGE: ${{ (matrix.os == 'macos-15-intel' && steps.image-cache.outputs.cache-hit == 'true') && '1' || '' }}
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            export SKIP_SANDBOX=1   # binary already built+installed above
          fi
          BRANCH="${{ github.event.pull_request.head.sha || github.sha }}" \
          REPO="${{ github.event.pull_request.head.repo.full_name || github.repository }}" \
            bash install.sh

      - name: Save built image for next run (macOS Intel)
        if: matrix.os == 'macos-15-intel' && steps.image-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          docker save claude_code_base:latest | gzip > /tmp/claude_code_base.tar.gz
          ls -lh /tmp/claude_code_base.tar.gz

      - name: Stage host paths the launcher bind-mounts
        run: |
          # Launcher mounts ~/.ssh (ro), ~/.claude (rw), ~/.claude.json (rw).
          # Docker auto-creates missing host paths as DIRECTORIES, which would
          # break the file mount on .claude.json. Pre-create explicitly.
          # Write {} not touch — claude rejects empty file as malformed JSON.
          mkdir -p "$HOME/.ssh" "$HOME/.claude"
          echo '{}' > "$HOME/.claude.json"

      # ============== STEP 2: run claude-yolo-automate =======================
      # Drives the real launcher (cross-OS) — Linux and macOS share this path.
      # The launcher now uses `-i` when stdin isn't a TTY, so no `script(1)`
      # wrapping is needed. claude -p is headless mode and prints to stdout.
      - name: Run claude-yolo-automate, ask Claude to invoke proxied python3
        if: steps.key.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          SANDBOX_MAP_PROCESSES: python3
        run: |
          set -euxo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          # Same-path WORK_DIR bind-mount in the launcher needs a predictable
          # SANDBOX_DIR = $WORK_DIR/.ultra_sandbox so absolute symlinks made
          # by `sandbox map` resolve inside the container.
          WORK="$RUNNER_TEMP/proj"
          mkdir -p "$WORK"
          cd "$WORK"

          PROMPT='Use the Bash tool to run python3 --version. Reply with ONLY that exact command output line, no preamble, no markdown, no extra words.'

          # Capture exit code separately so we can always print diagnostics
          # rather than letting pipefail swallow them. stream-json gives us
          # every message claude emits, including init failures and tool
          # errors that --output-format text silently drops.
          set +e
          claude-yolo-automate -p "$PROMPT" --output-format stream-json --verbose > /tmp/claude_raw.txt 2>&1
          RC=$?
          set -e

          echo "=== launcher exit code: $RC ==="
          echo "=== /tmp/claude_raw.txt (size: $(wc -c </tmp/claude_raw.txt) bytes) ==="
          cat /tmp/claude_raw.txt
          echo "=== end raw ==="

          HOST_VER="$(python3 --version 2>&1)"
          echo "expecting host python: $HOST_VER"
          if grep -F "$HOST_VER" /tmp/claude_raw.txt >/dev/null; then
            echo "PASS: claude-yolo-automate -> Claude -> Bash python3 -> proxied to host"
          else
            echo "FAIL: host python version not in Claude reply (launcher exit=$RC)"
            exit 1
          fi
